# golangci-lint v2 configuration
# Based on the Uber Go Style Guide's recommended linters.
#
# Default "standard" linters (enabled automatically):
#   errcheck, govet, ineffassign, staticcheck, unused
#
# Additional linters enabled below complement the defaults
# per the style guide's recommendations.

version: '2'

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - revive
  exclusions:
    paths:
      # `just format` and `just build-assets` export the frontend container's
      # node_modules into the working tree, and a few npm packages ship Go
      # sources of their own. They are not ours to lint.
      - node_modules

formatters:
  enable:
    - goimports
  exclusions:
    paths:
      - node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
